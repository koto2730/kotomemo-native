# Release: triggered by pushing a v* tag.
#
# Builds the same per-OS artifacts as build.yml on the same 3-OS matrix,
# then a release job downloads all artifacts and creates a GitHub Release
# as a *draft*. Mirrors kotomemo's release.yml.
#
# Re-tagging will fail because gh release create refuses to overwrite an
# existing release - delete the previous release manually if you need to
# retry a tag.

name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            formats: wix
            artifactPath: target/release/*.msi
          - os: macos-latest
            label: macos-arm64
            formats: dmg
            artifactPath: target/release/*.dmg
          - os: ubuntu-22.04
            label: linux
            formats: appimage,deb
            artifactPath: |
              target/release/*.AppImage
              target/release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libfuse2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        run: cargo packager --release -f ${{ matrix.formats }}

      - uses: actions/upload-artifact@v4
        with:
          name: kotomemo-native-${{ matrix.label }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is read-only by default; releases need contents: write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -lR artifacts/

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t files < <(find artifacts -type f)
          printf 'Attaching: %s\n' "${files[@]}"
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}" \
            "${files[@]}"
